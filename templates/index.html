<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dot Icon Studio</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="container">
    <h1>Dot Icon Studio</h1>

    <!-- 1. アップロードエリア -->
    <div class="upload-section" id="dropArea" onclick="document.getElementById('fileInput').click()">
      <p>📁 画像ファイルをドラッグ＆ドロップ、またはクリックして選択</p>
      <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImage(this.files[0])">
    </div>

    <!-- 2. 自動生成20候補表示エリア -->
    <div id="candidatesSection" style="display:none;">
      <div class="controls-bar">
        <h2>自動生成候補 (20個)</h2>
        <button class="btn btn-secondary" onclick="generate20Candidates()">🔄 他の候補を再取得</button>
      </div>

      <div class="patterns-container">
        <div class="pattern-group">
          <div class="pattern-title">パターンA: 標準スタイル (Standard)</div>
          <div class="grid" id="gridA"></div>
        </div>
        <div class="pattern-group">
          <div class="pattern-title">パターンB: 高精細・ファイン (Fine)</div>
          <div class="grid" id="gridB"></div>
        </div>
        <div class="pattern-group">
          <div class="pattern-title">パターンC: 大粒レトロ (Retro)</div>
          <div class="grid" id="gridC"></div>
        </div>
        <div class="pattern-group">
          <div class="pattern-title">パターンD: 輪郭強調 (Outline)</div>
          <div class="grid" id="gridD"></div>
        </div>
      </div>
    </div>

    <!-- 3. 手動微調整エディタ画面 -->
    <div class="editor-section" id="editorSection">
      <h2>ドット微調整エディタ</h2>
      <div class="editor-layout">
        <canvas id="editorCanvas" width="384" height="384"></canvas>
        
        <div class="editor-tools">
          <button class="tool-btn active" id="penBtn" onclick="setTool('pen')">✏️ ドットペン (描く)</button>
          <button class="tool-btn" id="eraserBtn" onclick="setTool('eraser')">🧹 消しゴム (消す)</button>
          <button class="tool-btn" onclick="clearEditor()">💥 クリア</button>
          
          <hr style="border-color:#333; width:100%;">

          <!-- サイズ・余白・位置調整セクション -->
          <div class="scale-controls" style="width: 100%; text-align: center;">
            <p style="font-size:12px; color:#aaa; margin-bottom: 5px;">🔍 サイズ・余白調整</p>
            <div style="display:flex; align-items:center; gap:5px; margin-bottom:10px;">
              <button class="btn btn-secondary" style="padding:2px 8px;" onclick="adjustScale(-0.1)">➖</button>
              <input type="range" id="scaleSlider" min="0.5" max="1.5" step="0.05" value="1.0" oninput="onScaleChange(this.value)" style="flex:1;">
              <button class="btn btn-secondary" style="padding:2px 8px;" onclick="adjustScale(0.1)">➕</button>
            </div>

            <p style="font-size:12px; color:#aaa; margin-bottom: 5px;">🎯 位置の移動</p>
            <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:3px; max-width:120px; margin:0 auto 10px auto;">
              <div></div>
              <button class="btn btn-secondary" style="padding:2px;" onclick="shiftPattern(0, -1)">⬆️</button>
              <div></div>
              <button class="btn btn-secondary" style="padding:2px;" onclick="shiftPattern(-1, 0)">⬅️</button>
              <button class="btn btn-secondary" style="padding:2px;" onclick="resetTransform()">🔄</button>
              <button class="btn btn-secondary" style="padding:2px;" onclick="shiftPattern(1, 0)">➡️</button>
              <div></div>
              <button class="btn btn-secondary" style="padding:2px;" onclick="shiftPattern(0, 1)">⬇️</button>
              <div></div>
            </div>

            <!-- 💡 今回追加する下絵（ゴースト）の濃さ調整スライダー -->
            <p style="font-size:12px; color:#aaa; margin-bottom: 5px;">👻 下絵ガイドの濃さ</p>
            <div style="display:flex; align-items:center; gap:5px; margin-bottom:10px;">
              <input type="range" id="ghostSlider" min="0" max="1" step="0.05" value="0.25" oninput="onGhostAlphaChange(this.value)" style="flex:1;">
            </div>
          </div>

          <hr style="border-color:#333; width:100%;">

          <div style="text-align:center;">
            <p style="font-size:12px; color:#aaa;">スマホアイコン見本</p>
            <div class="preview-badge">
              <canvas id="previewCanvas" width="64" height="64"></canvas>
            </div>
          </div>
          <hr style="border-color:#333; width:100%;">
          <button class="btn" onclick="downloadIcon()">💾 PNGダウンロード</button>
          <button class="btn btn-secondary" onclick="backToCandidates()">⬅ 候補一覧に戻る</button>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/editor.js') }}"></script>
</body>
</html>

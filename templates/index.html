<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dot Icon Studio</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="container">
    <h1>Dot Icon Studio</h1>

    <!-- モード選択タブ (3モード対応) -->
    <div class="mode-tabs" style="display:flex; gap:10px; margin-bottom:15px; flex-wrap:wrap;">
      <button class="btn active" id="tabAutoMode" onclick="switchMode('auto')" style="flex:1; min-width:140px;">🤖 1. 自動変換</button>
      <button class="btn btn-secondary" id="tabTraceMode" onclick="switchMode('trace')" style="flex:1; min-width:140px;">🎨 2. 下絵トレース</button>
      <button class="btn btn-secondary" id="tabManualMode" onclick="switchMode('manual')" style="flex:1; min-width:140px;">✏️ 3. 白紙手動作成</button>
    </div>

    <!-- 1. アップロードエリア -->
    <div class="upload-section" id="dropArea" onclick="document.getElementById('fileInput').click()">
      <p id="uploadText">📁 画像ファイルをドラッグ＆ドロップ、またはクリックして選択</p>
      <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImage(this.files[0])">
    </div>

    <!-- 白紙手動作成スタートボタン (白紙手動モード時のみ表示) -->
    <div id="manualStartArea" style="display:none; text-align:center; margin-bottom:20px;">
      <button class="btn" onclick="startBlankManual()" style="padding:12px 30px; font-size:16px;">✨ 白紙キャンバスで作成を開始</button>
    </div>

    <!-- 2. 自動生成20候補表示エリア（自動変換モードのみ） -->
    <div id="candidatesSection" style="display:none;">
      <div class="controls-bar">
        <h2>自動生成候補 (20個)</h2>
        <button class="btn btn-secondary" onclick="generate20Candidates()">🔄 他の候補を再取得</button>
      </div>

      <div class="patterns-container">
        <div class="pattern-group">
          <div class="pattern-title">パターンA: 標準スタイル (Standard)</div>
          <div class="grid" id="gridA"></div>
        </div>
        <div class="pattern-group">
          <div class="pattern-title">パターンB: 高精細・ファイン (Fine)</div>
          <div class="grid" id="gridB"></div>
        </div>
        <div class="pattern-group">
          <div class="pattern-title">パターンC: 大粒レトロ (Retro)</div>
          <div class="grid" id="gridC"></div>
        </div>
        <div class="pattern-group">
          <div class="pattern-title">パターンD: 輪郭強調 (Outline)</div>
          <div class="grid" id="gridD"></div>
        </div>
      </div>
    </div>

    <!-- 3. 手動微調整エディタ画面 -->
    <div class="editor-section" id="editorSection" style="display:none;">
      <h2 id="editorTitle">ドット微調整エディタ</h2>
      <div class="editor-layout">
        <canvas id="editorCanvas" width="384" height="384"></canvas>
        
        <div class="editor-tools">
          <div style="display:flex; gap:5px; width:100%;">
            <button class="tool-btn active" id="penBtn" onclick="setTool('pen')" style="flex:1;">✏️ ペン</button>
            <button class="tool-btn" id="eraserBtn" onclick="setTool('eraser')" style="flex:1;">🧹 消しゴム</button>
          </div>

          <!-- グリッド吸着切り替えスイッチ -->
          <div style="width:100%; margin-top:8px;">
            <label style="cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(255,255,255,0.08); padding: 8px; border-radius: 6px; color: #fff; font-size: 13px; user-select: none; border: 1px solid rgba(255,255,255,0.1);">
              <input type="checkbox" id="snapToggleCheckbox" checked onchange="toggleSnapMode(this.checked)" style="transform: scale(1.2); cursor: pointer;">
              <span>🔲 グリッド吸着 (Snap)</span>
            </label>
          </div>

          <!-- ▼ 指定ドット列データからの自動作成ボタン -->
          <button class="tool-btn" onclick="generateFromCustomColCounts()" style="width:100%; margin-top:8px; background: rgba(255, 180, 0, 0.2); border: 1px solid rgba(255, 180, 0, 0.4); color: #ffca28;">🔢 指定ドット列データで作成</button>

          <!-- ドット（円）の大きさ調整コントロール ＋ サイズ確認プレビュー枠 -->
          <div style="width:100%; background:rgba(255,255,255,0.05); padding:8px; border-radius:6px; margin-top:8px; text-align:center;">
            <p style="font-size:12px; color:#aaa; margin-bottom: 5px;">⚪ ドット（円）の大きさ</p>
            <div style="display:flex; align-items:center; gap:8px; justify-content:center;">
              <input type="range" id="dotSizeSlider" min="0.1" max="1.5" step="0.05" value="0.4" oninput="onDotSizeChange(this.value)" style="flex:1;">
              <canvas id="dotSizePreviewCanvas" width="36" height="36" style="background:#000; border-radius:50%; border:1px solid #555; display:block;"></canvas>
            </div>
          </div>

          <!-- 解像度（マス目のドット数）の変更 -->
          <div style="width:100%; text-align:center; margin-top:10px;">
            <p style="font-size:12px; color:#aaa; margin-bottom: 3px;">🔲 マス目サイズ（グリッド数）</p>
            <select id="gridSizeSelect" onchange="changeGridSize(this.value)" class="btn btn-secondary" style="width:100%; padding:4px;">
              <option value="18">18×18 (大粒レトロ)</option>
              <option value="24" selected>24×24 (標準)</option>
              <option value="32">32×32 (高精細)</option>
            </select>
          </div>

          <button class="tool-btn" onclick="clearEditor()" style="width:100%; margin-top:10px;">💥 クリア</button>
          
          <hr style="border-color:#333; width:100%;">

          <!-- サイズ・余白・位置調整セクション -->
          <div class="scale-controls" style="width: 100%; text-align: center;">
            <p style="font-size:12px; color:#aaa; margin-bottom: 5px;">🔍 表示拡大・縮小</p>
            <div style="display:flex; align-items:center; gap:5px; margin-bottom:10px;">
              <button class="btn btn-secondary" style="padding:2px 8px;" onclick="adjustScale(-0.1)">➖</button>
              <input type="range" id="scaleSlider" min="0.5" max="1.5" step="0.05" value="1.0" oninput="onScaleChange(this.value)" style="flex:1;">
              <button class="btn btn-secondary" style="padding:2px 8px;" onclick="adjustScale(0.1)">➕</button>
            </div>

            <p style="font-size:12px; color:#aaa; margin-bottom: 5px;">🎯 位置の移動</p>
            <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:3px; max-width:120px; margin:0 auto 10px auto;">
              <div></div>
              <button class="btn btn-secondary" style="padding:2px;" onclick="shiftPattern(0, -1)">⬆️</button>
              <div></div>
              <button class="btn btn-secondary" style="padding:2px;" onclick="shiftPattern(-1, 0)">⬅️</button>
              <button class="btn btn-secondary" style="padding:2px; background-color:#ff4444; color:white;" onclick="resetToDefaultAll()" title="初期状態に戻す">🔄</button>
              <button class="btn btn-secondary" style="padding:2px;" onclick="shiftPattern(1, 0)">➡️</button>
              <div></div>
              <button class="btn btn-secondary" style="padding:2px;" onclick="shiftPattern(0, 1)">⬇️</button>
              <div></div>
            </div>

            <!-- 下絵ガイドの濃さスライダー（トレーシングモードのみ有効） -->
            <div id="ghostControl" style="display:none;">
              <p style="font-size:12px; color:#aaa; margin-bottom: 5px;">👻 下絵ガイドの濃さ</p>
              <div style="display:flex; align-items:center; gap:5px; margin-bottom:10px;">
                <input type="range" id="ghostSlider" min="0" max="1" step="0.05" value="0.3" oninput="onGhostAlphaChange(this.value)" style="flex:1;">
              </div>
            </div>
          </div>

          <hr style="border-color:#333; width:100%;">

          <div style="text-align:center;">
            <p style="font-size:12px; color:#aaa;">スマホアイコン見本 (64x64)</p>
            <div class="preview-badge">
              <canvas id="previewCanvas" width="64" height="64"></canvas>
            </div>
          </div>
          <hr style="border-color:#333; width:100%;">
          <button class="btn" onclick="downloadIcon()" style="width:100%;">💾 PNGダウンロード</button>
          <button class="btn btn-secondary" id="backBtn" onclick="backToPrev()" style="width:100%; margin-top:5px;">⬅ 戻る</button>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/editor.js') }}"></script>
</body>
</html>
